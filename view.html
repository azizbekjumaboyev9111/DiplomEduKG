<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diplom.Edu.kg</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="js/theme.js"></script>
  </head>
  <body>
    <div class="site-logo">
      <img src="./files/logo.png" alt="Loading . . ." />
    </div>

    <a
      id="openBtn"
      href="#"
      target="_blank"
      rel="noopener"
      class="btn site-button"
      data-i18n="download_btn"
      hidden
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="5"
        height="5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3v12" />
        <path d="M7 10l5 5 5-5" />
        <path d="M5 21h14" />
      </svg>
      Скачать <span>PDF</span>
    </a>

    <div class="view-shell container">
      <!-- Fayl topilganda ko'rsatiladi -->
      <div class="doc-card" id="docFound" hidden>
        <div class="doc-frame-wrap">
          <div id="pdfContainer" class="pdf-container"></div>
        </div>
      </div>

      <!-- Fayl topilmaganda ko'rsatiladi -->
      <div class="doc-card" id="docNotFound" hidden>
        <div class="empty-state">
          <div class="icon-wrap">
            <svg viewBox="0 0 24 24">
              <path d="M12 9v4M12 17h.01" />
              <circle cx="12" cy="12" r="9" />
            </svg>
          </div>
          <h2 data-i18n="not_found_title">Файл табылган жок</h2>
          <p data-i18n="not_found_desc">
            Киргизилген ID туура эмес же мындай файл жок. ID номерин текшерип,
            кайра аракет кылып көрүңүз.
          </p>
          <a
            href="index.html"
            data-internal
            class="btn btn-primary"
            data-i18n="retry_btn"
            >Кайра аракет кылуу</a
          >
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/view.js"></script>
    <!-- <script src="js/i18n.js"></script> -->
    <script src="js/pulse.js"></script>
  </body>
</html>
