<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diplom.Edu.kg</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

  <div class="top-controls">
    <div class="lang-switch">
      <button type="button" data-lang="ky">KY</button>
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>

    <button class="theme-toggle" id="themeToggle" data-i18n-aria="theme_aria" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
    </button>
  </div>

  <div class="brand">
    <svg class="pulse-mark" viewBox="0 0 40 40"><path d="M2 20h6l3-9 5 18 4-13 3 4h15"/></svg>
    <span>Diplom.Edu.kg</span>
  </div>

  <div class="view-shell container">
    <a href="index.html" data-internal class="back-link">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span data-i18n="back_link">Башкы бетке кайтуу</span>
    </a>

    <!-- Fayl topilganda ko'rsatiladi -->
    <div class="doc-card" id="docFound" hidden>
      <div class="doc-toolbar">
        <div>
          <h2 data-i18n="doc_found_title">Сиздин файлыңыз</h2>
          <span class="id-pill"><span data-i18n="id_label">ID:</span> <span id="docId"></span></span>
        </div>
        <a id="openBtn" href="#" target="_blank" rel="noopener" class="btn btn-primary" data-i18n="download_btn">
          Жүктөп алуу
        </a>
      </div>
      <div class="doc-frame-wrap">
        <iframe id="pdfFrame" title="PDF hujjat" loading="lazy"></iframe>
      </div>
    </div>

    <!-- Fayl topilmaganda ko'rsatiladi -->
    <div class="doc-card" id="docNotFound" hidden>
      <div class="empty-state">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
        </div>
        <h2 data-i18n="not_found_title">Файл табылган жок</h2>
        <p data-i18n="not_found_desc">Киргизилген ID туура эмес же мындай файл жок. ID номерин текшерип, кайра аракет кылып көрүңүз.</p>
        <a href="index.html" data-internal class="btn btn-primary" data-i18n="retry_btn">Кайра аракет кылуу</a>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p><span data-i18n="footer_contact">Суроолор жана кайрылуулар үчүн:</span>
        <a href="mailto:jumaboyev911@gmail.com">jumaboyev911@gmail.com</a>
      </p>
      <p style="margin-top:8px; font-size:0.85rem; opacity:.7;">© <span id="year"></span> Diplom.Edu.kg</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/view.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/pulse.js"></script>
</body>
</html>
